services:
  traefik:
    image: traefik:3.1
    ports:
      - 80:80 # HTTP (redirects to HTTPS)
      - 443:443 # HTTPS
      - 8888:8080 # Traefik dashboard
    volumes:
      # Dev certs for *.dev domains (self-signed, mkcert generated)
      - "./services/traefik/certs/:/certs/:ro"
      # Production certs for real domains (Let's Encrypt, auto-generated)
      - "./var/data/traefik/acme.json:/acme.json"
      - "./services/traefik/traefik.yaml:/traefik.yaml:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    command:
      - "--configFile=/traefik.yaml"
      # Let's Encrypt config (only used if ACME_EMAIL is set)
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

  api.db:
    image: postgres:13-alpine
    container_name: api.db
    environment:
      POSTGRES_DB: api
      POSTGRES_USER: api
      POSTGRES_PASSWORD: api
    healthcheck:
      interval: 5s
      test:
        - CMD-SHELL
        - pg_isready
        - -d
        - api
    ports:
      - 5439:5432
    restart: on-failure
    volumes:
      - ./var/data/api/:/var/lib/postgresql/data/

  api.migrate:
    image: migrate/migrate
    working_dir: /migrations
    volumes:
      - ./backend/assets/migrations:/migrations
    depends_on:
      api.db:
        condition: service_healthy
    entrypoint:
      - "sh"
      - "-c"
      - "migrate -database=postgres://api:api@api.db:5432/api?sslmode=disable -path=/migrations/ up"

  api.server:
    build:
      context: ./backend
      dockerfile: build/server/Dockerfile
    environment:
      SP_DB_HOST: api.db
      SP_DB_PORT: "5432"
      SP_DB_NAME: api
      SP_DB_USER: api
      SP_DB_PASSWORD: api
      SP_HTTP_PORT: 8080
      SP_BASE_URL: https://api.${DOMAIN:-starterpack.dev}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN:-starterpack.dev}`)"
      - "traefik.http.routers.api.tls=true"
      # Use Let's Encrypt only if ACME_EMAIL is set (production)
      # Otherwise falls back to static certs from /certs/ (development)
      - "traefik.http.routers.api.tls.certresolver=${ACME_EMAIL:+letsencrypt}"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
    depends_on:
      - api.migrate
      - api.db
      - traefik
